<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Referee | Seiche</title>
<meta name="description" content="The global liquidity category's headline
claims, tested on the publicly reconstructible layer, with bootstrap
intervals, walk forward tests and both causal directions published.">
<style>
:root { --bg:#000; --panel:#0b0d15; --edge:#1c1f2b; --text:#edeef4;
        --dim:#9aa0b6; --faint:#787f95; --accent:#9c8fe8;
        --accent-soft:#bbaffe; --accent-bright:#d9d4ff;
        --mono:ui-monospace,Menlo,Consolas,monospace;
        color-scheme:dark; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text);
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
       font-size:14px; line-height:1.7; max-width:820px; margin:0 auto;
       padding:40px 24px 90px; }
a { color:var(--accent-soft); text-decoration:none; }
a:hover { color:var(--accent-bright); text-decoration:underline; }
h1 { font-weight:500; font-size:clamp(26px,4.6vw,34px); letter-spacing:-.02em;
     margin:30px 0 6px; }
h2 { font-weight:500; font-size:11.5px; letter-spacing:.15em;
     text-transform:uppercase; color:var(--accent); margin:44px 0 14px;
     padding-top:20px; border-top:1px solid var(--edge); }
h3 { font-weight:600; font-size:13.5px; margin:18px 0 4px; }
p { margin:12px 0; }
.dim { color:var(--dim); }
.faint { color:var(--faint); font-size:12px; }
code, .mono { font-family:var(--mono); font-size:.9em; }
code { background:var(--panel); padding:1px 6px; border-radius:5px;
       color:var(--accent-bright); }
table { border-collapse:collapse; width:100%; margin:14px 0; font-size:13px; }
th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--edge); }
th { color:var(--faint); font-weight:500; font-size:11px;
     letter-spacing:.08em; text-transform:uppercase; }
td.num { font-family:var(--mono); }
.cite { background:var(--panel); border:1px solid var(--edge); border-radius:10px;
        padding:14px 16px; font-family:var(--mono); font-size:12.5px;
        white-space:pre-wrap; word-break:break-word; margin:14px 0; }
ul { margin:12px 0 12px 20px; }
li { margin:6px 0; }
.top { display:flex; justify-content:space-between; align-items:baseline;
       gap:14px; flex-wrap:wrap; padding-bottom:16px;
       border-bottom:1px solid var(--edge); }
.wordmark { font-weight:500; letter-spacing:.30em; font-size:18px; }
.wordmark span { color:var(--accent); }

.claim { border-top:1px solid var(--edge); padding-top:18px; margin:26px 0 0; }
.claim h3 { display:flex; justify-content:space-between; align-items:baseline;
            gap:12px; flex-wrap:wrap; font-size:15px; margin:0 0 2px; }
.tok { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
       font-weight:600; padding:3px 9px; border-radius:6px; border:1px solid;
       white-space:nowrap; }
.tok-fail { color:#e08a8a; border-color:#5a2c2c; background:#1a0c0c; }
.tok-part { color:#d6c37f; border-color:#5a512c; background:#1a170c; }
.tok-pass { color:#7fd6a2; border-color:#2c5a41; background:#0c1a13; }
.tok-open { color:#9ab0c4; border-color:#2c3f5a; background:#0c111a; }
table.ref { border-collapse:collapse; margin:12px 0; font-size:13px; }
table.ref th, table.ref td { border:1px solid var(--edge); padding:5px 10px;
                             text-align:right; }
table.ref th:first-child, table.ref td:first-child { text-align:left; }
table.ref td.rub-ev { text-align:left; max-width:620px; }
</style>
</head>
<body>
<p>The referee analysis is not available today: engine block missing from the snapshot. The page publishes only what the engine computed; when the inputs are dark this notice is the whole content, by design.</p>
</body>
</html>
