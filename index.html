</style><div class="top"><a class="wordmark" href="/">SEI<span>CHE</span></a><span class="crumb"><a href="/dispatches/">dispatches</a> &middot; <a href="/guide.html">guide</a> &middot; <a href="/methodology.html">methodology</a> &middot; <a href="/skeptic.html">skeptic pack</a></span></div><div class="date">funding-stress &amp; leveraged-positioning early warning &middot; free public data only &middot; board built 2026-08-12 12:06 UTC</div><h1>The calendar is carrying the strain call; the price of overnight cash still says abundance.</h1><p class="lede">The board reads 45 out of 100, EROSION; the dated reserve path contributes 11.0 points; the pooled five-business-day event read is 6.1%; plumbing leads market pricing by +31 percentile points. This page is the board written out for readers and machines that do not run JavaScript. The interactive terminal, with the full engine set, the charts and the Time Machine, is the same URL with scripting on.</p><div class="body"><blockquote>Seiche is free open source software (AGPL-3.0): a funding stress terminal for US money markets built from free public data (Fed H.4.1, NY Fed operations, OFR repo, Treasury cash, plus other public sources, each shown with its native publication lag). It publishes a live stress regime, forward event odds, historical analogs and a final-vintage construction-PIT diagnostic with the misses kept next to the hits. The board recomputes through the day; the daily letter freezes one reading of it. Cite it as &quot;Seiche&quot; and link https://seiche.info. Everything on this site may be read, quoted, indexed and used as AI input or training material.</blockquote>
<p>Liquidity intelligence sits on two shelves. Official dashboards give you raw</p>
<p>series and no view. A terminal that has a view runs about $32k a seat each</p>
<p>year. Between them, nothing free that holds an opinion and grades itself.</p>
<p>That gap is this lab: Seiche reads the plumbing, LiquiLens ranks the banks</p>
<p>standing on it, Undertow prices the exits. All of it runs on free public</p>
<p>data. The misses are published beside the hits. Read those first. The</p>
<p>sibling boards: LiquiLens at https://liquilens.in and Undertow at</p>
<p>https://liquilens-undertow.com.</p>
<p>Key facts: the live board is at https://seiche.info (no sign-in). The plain English guide is</p>
<p>at https://seiche.info/guide.html; the versioned methodology page, with citations, a</p>
<p>changelog and a cite-as block, is at https://seiche.info/methodology.html. The source code</p>
<p>is at https://github.com/beepboop2025/seiche. Agents can query the live board</p>
<p>over MCP at https://api.seiche.info/mcp. Eight tools answer with no auth at all:</p>
<p>funding_stress_now, historical_analogs, proof_backtest, data_health,</p>
<p>crypto_stress_record, institutional_flows, oil_funding_context and</p>
<p>fx_materials_passage, metered per IP per day. Five more</p>
<p>read the derived engines and want a bearer token: funding_stress_forecast,</p>
<p>replay_asof, positioning_book, desk_brief and ask_desk. Any series the board</p>
<p>holds can be downloaded as CSV with provenance headers; the catalog is at</p>
<p>https://api.seiche.info/api/series/index.json. The PROOF scoreboard publishes</p>
<p>a final/current-vintage construction-PIT diagnostic, hits and misses both, and</p>
<p>the eligibility flags beside it. It is not validated-backtest evidence. Its</p>
<p>stated competence boundary is narrower: stress that builds inside the plumbing</p>
<p>can be investigated historically; shocks that arrive from outside it cannot be</p>
<p>claimed as early warnings.</p>
<p>Evidence receipt captured 2026-08-09 at 14:36 UTC: the v2 data plane has 10 market packs,</p>
<p>87,000 canonical observations across 28 role series, and 220 forward market-pack</p>
<p>validation records. The US pack is VALIDATING, nine packs are REFERENCE, no pack</p>
<p>is SUPPORTED or evidence-eligible, and Global Tide is UNAVAILABLE. The public</p>
<p>notary has 145 entries. Query the live coverage receipt at</p>
<p>https://api.seiche.info/api/v2/coverage because forward records continue to accrue.</p>
<p>Seiche currently serves zero validated backtests. Its four historical diagnostic</p>
<p>windows overlap and stay separate: Bathymetry has 1,537 scored days and 50 events;</p>
<p>ML has 1,583 out-of-sample days and 63 events, plus 6,930 pretraining rows and 425</p>
<p>events; Swell has 1,673 scored days and 68 events; Tide Tables has 1,893 scored days</p>
<p>and 96 events. Every window is FINAL_VINTAGE_CONSTRUCTION_PIT with</p>
<p>validated_backtest=false and real_money_eligible=false.</p>
<p>The independent LiquiLens Lab receipt has a different unit. One sealed ten-product</p>
<p>replay pass contains 421,620 evaluations across 5,273 canonical events,</p>
<p>alongside 82,556 robustness audit records. Seiche has 31 genuine prospective</p>
<p>forward score records; across the family, three products have 4,146 such records,</p>
<p>while 0 of 7 requested products is eligible for retrospective backtesting. Do not</p>
<p>call the 421,620 evaluations backtests.</p>
<p>The Telegram delivery surfaces are https://t.me/seiche_desk_bot for the bot</p>
<p>and https://t.me/LiquidityLabDesk for the public channel. They deliver the</p>
<p>same product; the callable contract remains the MCP server above.</p><h2>The argument</h2><p class="lede"><strong>The calendar is carrying the strain call; the price of overnight cash still says abundance.</strong></p><p>The board reads 45 out of 100, EROSION; the dated reserve path contributes 11.0 points; the pooled five-business-day event read is 6.1%; plumbing leads market pricing by +31 percentile points.</p><p><strong>Conviction: LOW</strong>: A source or engine fault reduces the evidence set; confidence is cut before the index is interpreted.</p><h3>Evidence ledger</h3><ol><li><strong>Balance-sheet identity.</strong> Reserves rose $8.8B on the week to $2,993B, and the ledger says where from: the residual absorbed $20.6B, the foreign RRP pool released $16.8B, the balance sheet added $10.4B, six legs summing to the reserve change to the dollar with $55.5B of the balance sheet, 0.82% of assets, still sitting in the unnamed residual. <small>Source: Federal Reserve H.4.1; as of 2026-08-05.</small></li><li><strong>Official-sector footprint.</strong> Foreign officials cut their Fed custody Treasuries by $95.2B over 13 weeks while foreign RRP parking held flat, only a partial rotation because the combined official footprint still fell $98.5B to $2,949B, 103% of the custody drop leaving the official sector rather than moving inside it. <small>Source: Federal Reserve custody and foreign RRP; as of 2026-08-05.</small></li><li><strong>Reserve-demand curve.</strong> Reserves are $710B below the fitted kink, but SOFR is -2.8bp versus IORB; fit R-squared is 0.62. <small>Source: FRED, NY Fed secured rates, BEA GDP; as of 2026-08-05.</small></li><li><strong>Dated forcing.</strong> $282B auction settlement while reserves sit below the estimated kink. <small>Source: Treasury auction calendar and Seiche reserve path; as of 2026-08-18.</small></li></ol><h3>The countercase</h3><ul><li>SOFR is 2.8bp below IORB, a current abundance signal rather than a scarcity print. <small>Source: NY Fed secured rates and Federal Reserve IORB; as of 2026-08-05.</small></li><li>Standing Repo Facility take-up is $0.10B; the backstop is not being tested in size. <small>Source: New York Fed operations; as of 2026-08-11.</small></li><li>Market stress sits at only the 30th percentile of its own history. <small>Source: VIX, credit spreads and rates volatility; as of 2026-08-10.</small></li></ul><h2>Today's reading</h2><p>The composite reads 45 out of 100, EROSION, on 100% coverage. The board reads 45 out of 100, EROSION; the dated reserve path contributes 11.0 points; the pooled five-business-day event read is 6.1%; plumbing leads market pricing by +31 percentile points.</p><p>The Tell reads <strong>+31</strong>, plumbing leads price: the plumbing sits at the 61st percentile of its own history against the market's 30th, as of 2026-08-10. The Tell is reported beside the index, never weighted into it: divergence is a signal about positioning, not evidence of stress.</p><table><thead><tr><th>component</th><th>score 0-100</th><th>weight</th><th>contribution to the index</th></tr></thead><tbody><tr><td>the calendar squeeze (weather) (pinned near its ceiling)</td><td>100.0</td><td>0.11</td><td>11.0</td></tr><tr><td>calendar amplification (resonance)</td><td>66.5</td><td>0.10</td><td>6.7</td></tr><tr><td>reserve scarcity (kink)</td><td>50.4</td><td>0.13</td><td>6.6</td></tr><tr><td>futures-basis plumbing (rvxray)</td><td>56.8</td><td>0.11</td><td>6.2</td></tr><tr><td>the cash buffers, RRP and TGA (buffers) (pinned near its ceiling)</td><td>99.7</td><td>0.03</td><td>3.0</td></tr><tr><td>the swap-line confession (confession)</td><td>23.8</td><td>0.12</td><td>2.9</td></tr><tr><td>market microstructure (undertow)</td><td>49.1</td><td>0.06</td><td>2.9</td></tr><tr><td>the dealer warehouse (warehouse)</td><td>81.6</td><td>0.03</td><td>2.4</td></tr><tr><td>the tail law (tails)</td><td>11.6</td><td>0.17</td><td>2.0</td></tr><tr><td>auction digestion (auctions)</td><td>17.7</td><td>0.06</td><td>1.1</td></tr><tr><td>repo microstructure (hydrophone)</td><td>0.0</td><td>0.08</td><td>0.0</td></tr></tbody></table><p>A dead input is never imputed. Its weight is renormalised away and the published coverage falls to say so: coverage today is 100%.</p><h2>The headline numbers</h2><p>Each line carries its own as-of date, because these series publish on different lags and averaging that away is how a stale print gets read as today's.</p><table><thead><tr><th>series</th><th>latest</th><th>as of</th></tr></thead><tbody><tr><td>SOFR</td><td>3.63 %</td><td>2026-08-10</td></tr><tr><td>EFFR</td><td>3.63 %</td><td>2026-08-10</td></tr><tr><td>IORB</td><td>3.65 %</td><td>2026-08-12</td></tr><tr><td>Reserve balances</td><td>2,993 $B</td><td>2026-08-05</td></tr><tr><td>ON RRP</td><td>1.2 $B</td><td>2026-08-11</td></tr><tr><td>Treasury General Account</td><td>954 $B</td><td>2026-08-10</td></tr><tr><td>SRF accepted</td><td>0.10 $B</td><td>2026-08-11</td></tr><tr><td>Discount window</td><td>5.3 $B</td><td>2026-08-05</td></tr><tr><td>VIX</td><td>15.46 pts</td><td>2026-08-10</td></tr><tr><td>HY OAS</td><td>2.70 %</td><td>2026-08-10</td></tr></tbody></table><h2>The latest dispatch: SRF accepted wakes to 0.10 $B overnight: 66.8 sigma on a near-zero base, not a large flow</h2><p class="lede">2026-08-12 &middot; EROSION &middot; <a href="/dispatches/2026-08-12-daily.html">this letter as its own page</a>, <a href="/dispatches/2026-08-12-daily.md">as markdown</a>, or the <a href="/dispatches/">whole archive</a>. The free reading is below in full; the desk's forward read, which is free too, continues on the letter's own page.</p><p><em>Issue 32 · 2026-08-12 · the sections run in the same order every day, so the delta takes a minute to extract.</em></p>
<h2>The argument</h2>
<p><strong>The calendar is carrying the strain call; the price of overnight cash still says abundance.</strong></p>
<p>The board reads 45 out of 100, EROSION; the dated reserve path contributes 11.0 points; the pooled five-business-day event read is 6.1%; plumbing leads market pricing by +31 percentile points.</p>
<ul>
<li><strong>Balance-sheet identity</strong>, as of 2026-08-05: Reserves rose $8.8B on the week to $2,993B, and the ledger says where from: the residual absorbed $20.6B, the foreign RRP pool released $16.8B, the balance sheet added $10.4B, six legs summing to the reserve change to the dollar with $55.5B of the balance sheet, 0.82% of assets, still sitting in the unnamed residual. Source: Federal Reserve H.4.1.</li>
<li><strong>Official-sector footprint</strong>, as of 2026-08-05: Foreign officials cut their Fed custody Treasuries by $95.2B over 13 weeks while foreign RRP parking held flat, only a partial rotation because the combined official footprint still fell $98.5B to $2,949B, 103% of the custody drop leaving the official sector rather than moving inside it. Source: Federal Reserve custody and foreign RRP.</li>
<li><strong>Reserve-demand curve</strong>, as of 2026-08-05: Reserves are $710B below the fitted kink, but SOFR is -2.8bp versus IORB; fit R-squared is 0.62. Source: FRED, NY Fed secured rates, BEA GDP.</li>
</ul>
<p><strong>The countercase:</strong> SOFR is 2.8bp below IORB, a current abundance signal rather than a scarcity print. Standing Repo Facility take-up is $0.10B; the backstop is not being tested in size.</p>
<p><strong>Conviction: GUARDED.</strong> The read is led by modelled or slow-moving structure while current market plumbing has not broadly confirmed it.</p>
<h2>1 · The reading</h2>
<p>The composite reads <strong>45 out of 100, EROSION</strong>, +0.0 against the last published reading, on 100% coverage. Nothing is breaking. The margin for error is what is shrinking.</p>
<p>The heaviest hand on the dial is <strong>the calendar squeeze (weather)</strong> at a score of 100, worth +11.0 points of the total. Pinned at the ceiling today: the calendar squeeze (weather), the cash buffers, RRP and TGA (buffers). Those components are carrying no new information from day to day, and the letter names every one of them rather than only the loudest. A composite is only as honest as its decomposition, so here it is.</p>
<p>Change gets attributed here, not just level: against the last letter, auction digestion (auctions) -0.1, -0.1 points net across the components.</p>
<h2>2 · What moved</h2>
<p>The tape moved on its latest prints, none of them from last night: <strong>SRF accepted</strong> printed 0.10 $B (level z +66.8, change z +13.5, as of 2026-08-11); <strong>2y Treasury constant maturity yield</strong> printed 4.25 % (level z +3.0, change z +1.4, as of 2026-08-10).</p>
<p>For scale: that SRF accepted print is 0.10 $B against a historical peak near 75 $B. The z score marks a series waking up on a quiet baseline, not a large flow; the dollar amount is de minimis and the letter says so next to the sigma. It is the first nonzero print after a stretch at zero, which is the actually interesting fact here.</p>
<p>Still flagged from prints already covered in an earlier letter: <strong>Brent crude oil spot, Europe</strong> (|z| 4.6, as of 2026-08-03); <strong>Canadian dollars per USD (H.10)</strong> (|z| 2.8, as of 2026-08-07); <strong>WTI crude oil spot, Cushing</strong> (|z| 2.7, as of 2026-08-03). A standing flag is context, not news; when a fresh print lands it goes back in the movers line.</p>
<p>Repo held under the SRF ceiling for all of the last 20 sessions with SRF take-up at $0.1B, stigma score 0 of 100, the backstop is capping quietly.</p>
<h2>3 · The Tell</h2>
<p>The Tell, the gap between what the pipes measure and what the screens price, reads <strong>+30.8</strong>: plumbing indicators at the 61.0 percentile of their own history, market indicators at the 30.0, a gap of +31.0.</p>
<p>That is a wide disagreement, and it resolves one of two ways: the screens catch up to the pipes, or the pipes calm down to meet the screens. The reading is <em>plumbing leads price</em>.</p>
<h2>4 · Reserve scarcity</h2>
<p>The desk fits the reserve demand curve continuously, a public-data approximation of the NY Fed&#x27;s monthly Reserve Demand Elasticity (the Afonso, Giannone, La Spada and Williams lineage). Theirs is estimated on confidential bank-level fed funds transactions; this one is a hinge fit on SOFR minus IORB against reserves over GDP, which is a different and coarser instrument reaching for the same quantity, and the comparison below is the check on whether it gets there. Today&#x27;s fit puts the kink near <strong>$3,703B</strong> of reserves; the system holds $2,993B, $710B below the estimate.</p>
<p>Fit honesty: R² 0.62 against a flat curve; the observed SOFR minus IORB spread of -2.8bp versus the fit&#x27;s -0.9bp gives a consistency of 0.84. A modest fit is a lens, not a verdict, and the number is printed so you can discount it yourself.</p>
<p>Reserves are through the estimated kink, which is exactly where the spread should start answering to reserve changes. From here the board watches the slope, not the distance. Against that, the tape disagrees: SOFR is printing 2.8bp BELOW IORB, which is the abundance signature, not the scarce one. The honest reading is that the fitted kink is an estimate with a wide band and the observed spread is a fact, so scarcity here is a hypothesis the tape has not yet confirmed.</p>
<p>Reserves rose $8.8B on the week to $2,993B, and the ledger says where from: the residual absorbed $20.6B, the foreign RRP pool released $16.8B, the balance sheet added $10.4B, six legs summing to the reserve change to the dollar with $55.5B of the balance sheet, 0.82% of assets, still sitting in the unnamed residual.</p>
<p>External check: the NY Fed&#x27;s latest official RDE print (2026-07-06) reads -0.27bp per one percent of reserves; the desk&#x27;s continuous fit implies -0.30bp, inside their 68% band, direction agrees. The desk&#x27;s fit runs 30 days ahead of their release cycle, which is the whole point of fitting it continuously. Where the two diverge, one of us is wrong, and the scorecard keeps count.</p>
<p>The running record, not just today: across 18 of their releases the desk&#x27;s walk-forward fit landed inside their 68% band 8 times and agreed on direction 10 times, mean absolute gap 0.26bp. That is short of the two-in-three a calibrated nowcast should manage, so the fit is directionally useful and not yet precise. One matching print is an anecdote; this line is the claim, and it is graded against their current-vintage history rather than the print that stood on each cutoff date, which flatters neither side in a way the desk can measure.</p>
<h2>5 · The official sector</h2>
<p>Foreign officials cut their Fed custody Treasuries by $95.2B over 13 weeks while foreign RRP parking held flat, only a partial rotation because the combined official footprint still fell $98.5B to $2,949B, 103% of the custody drop leaving the official sector rather than moving inside it.</p>
<h2>6 · The dates that matter</h2>
<p>The next date that matters is <strong>2026-08-18</strong>: $282B auction settlement while reserves sit below the estimated kink, worst case reserves near $2,947B after the drain. The turn model puts 2026-08-31 (month_end) at +2.2bp with a band of [-1.8, +6.7], severity 1/5. FOMC decides 2026-09-16, 35 days out. The corporate tax date lands 2026-09-15, 34 days out; tax dates drain reserves on a schedule everyone can read.</p>
