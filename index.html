</style><div class="top"><a class="wordmark" href="/">SEI<span>CHE</span></a><span class="crumb"><a href="/dispatches/">dispatches</a> &middot; <a href="/guide.html">guide</a> &middot; <a href="/methodology.html">methodology</a> &middot; <a href="/skeptic.html">skeptic pack</a></span></div><div class="date">funding-stress &amp; leveraged-positioning early warning &middot; free public data only &middot; board built 2026-08-05 19:39 UTC</div><h1>The board reads STRAIN, 45 out of 100</h1><p class="lede">The pipes are working harder for the same result. This is the regime where surprises stop being cheap. This page is the board written out for readers and machines that do not run JavaScript. The interactive terminal, with the full engine set, the charts and the Time Machine, is the same URL with scripting on.</p><div class="body"><blockquote>Seiche is free open source software (AGPL-3.0): a funding stress terminal for US money markets built from free public data (Fed H.4.1, NY Fed operations, OFR repo, Treasury cash, plus other public sources, each shown with its native publication lag). It publishes a live stress regime, forward event odds, historical analogs and a point-in-time backtest with the misses kept next to the hits. The board recomputes through the day; the daily letter freezes one reading of it. Cite it as &quot;Seiche&quot; and link https://seiche.info. Everything on this site may be read, quoted, indexed and used as AI input or training material.</blockquote>
<p>Liquidity intelligence sits on two shelves. Official dashboards give you raw</p>
<p>series and no view. A terminal that has a view runs about $32k a seat each</p>
<p>year. Between them, nothing free that holds an opinion and grades itself.</p>
<p>That gap is this lab: Seiche reads the plumbing, LiquiLens ranks the banks</p>
<p>standing on it, Undertow prices the exits. All of it runs on free public</p>
<p>data. The misses are published beside the hits. Read those first. The</p>
<p>sibling boards: LiquiLens at https://liquilens.in and Undertow at</p>
<p>https://t.me/undertow_LiquiLens_bot.</p>
<p>Key facts: the live board is at https://seiche.info (no sign-in). The plain English guide is</p>
<p>at https://seiche.info/guide.html; the versioned methodology page, with citations, a</p>
<p>changelog and a cite-as block, is at https://seiche.info/methodology.html. The source code</p>
<p>is at https://github.com/beepboop2025/seiche. Agents can query the live board</p>
<p>over MCP at https://api.seiche.info/mcp. Six tools answer with no auth at all:</p>
<p>funding_stress_now, historical_analogs, proof_backtest, data_health,</p>
<p>crypto_stress_record and institutional_flows, metered per IP per day. Five more</p>
<p>read the derived engines and want a bearer token: funding_stress_forecast,</p>
<p>replay_asof, positioning_book, desk_brief and ask_desk. Any series the board</p>
<p>holds can be downloaded as CSV with provenance headers; the catalog is at</p>
<p>https://api.seiche.info/api/series/index.json. The PROOF scoreboard publishes</p>
<p>the backtest record, hits and misses both, and states the competence boundary:</p>
<p>stress that builds inside the plumbing can be seen early, shocks that arrive</p>
<p>from outside it cannot.</p><h2>Today's reading</h2><p>The composite reads 45 out of 100, STRAIN, on 100% coverage. The pipes are working harder for the same result. This is the regime where surprises stop being cheap.</p><p>The Tell reads <strong>+39</strong>, plumbing leads price: the plumbing sits at the 68th percentile of its own history against the market's 29th, as of 2026-08-04. The Tell is reported beside the index, never weighted into it: divergence is a signal about positioning, not evidence of stress.</p><table><thead><tr><th>component</th><th>score 0-100</th><th>weight</th><th>contribution to the index</th></tr></thead><tbody><tr><td>the calendar squeeze (weather) (pinned near its ceiling)</td><td>100.0</td><td>0.11</td><td>11.0</td></tr><tr><td>calendar amplification (resonance)</td><td>66.5</td><td>0.10</td><td>6.7</td></tr><tr><td>futures-basis plumbing (rvxray)</td><td>57.1</td><td>0.11</td><td>6.3</td></tr><tr><td>reserve scarcity (kink)</td><td>45.6</td><td>0.13</td><td>5.9</td></tr><tr><td>the swap-line confession (confession)</td><td>31.3</td><td>0.12</td><td>3.8</td></tr><tr><td>the cash buffers, RRP and TGA (buffers) (pinned near its ceiling)</td><td>99.6</td><td>0.03</td><td>3.0</td></tr><tr><td>market microstructure (undertow)</td><td>48.4</td><td>0.06</td><td>2.9</td></tr><tr><td>the dealer warehouse (warehouse)</td><td>81.6</td><td>0.03</td><td>2.4</td></tr><tr><td>the tail law (tails)</td><td>13.7</td><td>0.17</td><td>2.3</td></tr><tr><td>auction digestion (auctions)</td><td>18.3</td><td>0.06</td><td>1.1</td></tr><tr><td>repo microstructure (hydrophone)</td><td>0.0</td><td>0.08</td><td>0.0</td></tr></tbody></table><p>A dead input is never imputed. Its weight is renormalised away and the published coverage falls to say so: coverage today is 100%.</p><h2>The headline numbers</h2><p>Each line carries its own as-of date, because these series publish on different lags and averaging that away is how a stale print gets read as today's.</p><table><thead><tr><th>series</th><th>latest</th><th>as of</th></tr></thead><tbody><tr><td>SOFR</td><td>3.66 %</td><td>2026-08-04</td></tr><tr><td>EFFR</td><td>3.63 %</td><td>2026-08-04</td></tr><tr><td>IORB</td><td>3.65 %</td><td>2026-08-05</td></tr><tr><td>Reserve balances</td><td>2,985 $B</td><td>2026-07-29</td></tr><tr><td>ON RRP</td><td>1.6 $B</td><td>2026-08-05</td></tr><tr><td>Treasury General Account</td><td>877 $B</td><td>2026-08-03</td></tr><tr><td>SRF accepted</td><td>0.00 $B</td><td>2026-08-05</td></tr><tr><td>Discount window</td><td>6.5 $B</td><td>2026-07-29</td></tr><tr><td>VIX</td><td>16.50 pts</td><td>2026-08-04</td></tr><tr><td>HY OAS</td><td>2.73 %</td><td>2026-08-04</td></tr></tbody></table><h2>PROOF: the record, misses included</h2><p>The scoreboard and the misses are published together, because the record is the product. On 13 funding events the board recalled <strong>62%</strong> (95% interval 36% to 82%), at a base rate of 4.5%, with run-level precision 17% and a median lead of 60 days.</p><p>What the board says against itself:</p><ul><li>expanding-window standardization only, no look-ahead in the signal</li><li>alert threshold fixed in config, not fitted to outcomes</li><li>final-vintage data (weekly H.4.1 aggregates are lightly revised; daily market prints effectively are not)</li><li>overlapping forward windows: n_independent ≈ n_days / horizon is shown</li><li>Seiche-lite excludes live-only engines (weather/resonance/hydrophone/warehouse), the live index has MORE information than this backtest</li><li>event count is small, Wilson 95% intervals are printed next to every rate; run-level precision is the load-bearing number (alert days are serially correlated)</li><li>the lite index contains spread/tail terms and the event is a spread spike, see the ORTHOGONAL test for the same claim with the target&#x27;s own variables removed</li></ul><table><thead><tr><th>date</th><th>episode</th><th>sample</th></tr></thead><tbody><tr><td>2019-09-17</td><td>Sep 2019 repo spike (SOFR 5.25%, GC 10%)</td><td>out of sample</td></tr><tr><td>2020-03-16</td><td>Mar 2020 dash-for-cash</td><td>in sample</td></tr><tr><td>2023-03-13</td><td>Mar 2023 SVB / regional bank run</td><td>in sample</td></tr><tr><td>2025-04-09</td><td>Apr 2025 tariff shock basis unwind</td><td>in sample</td></tr><tr><td>2025-09-15</td><td>Sep 2025 tax-date squeeze (SOFR +18bp over EFFR)</td><td>in sample</td></tr><tr><td>2025-12-31</td><td>Dec 2025 year-end squeeze (SRF $74.6B record)</td><td>in sample</td></tr></tbody></table><h2>The latest dispatch: S&amp;P 500 index moves +136.02 pts to 7,736.52 pts overnight: 2.7 sigma against its own history</h2><p class="lede">2026-08-05 &middot; STRAIN &middot; <a href="/dispatches/2026-08-05-daily.html">this letter as its own page</a>, <a href="/dispatches/2026-08-05-daily.md">as markdown</a>, or the <a href="/dispatches/">whole archive</a>. The free reading is below in full; the desk's forward read, which is free too, continues on the letter's own page.</p><p><em>Issue 25 · 2026-08-05 · the sections run in the same order every day, so the delta takes a minute to extract.</em></p>
<h2>1 · The reading</h2>
<p>The composite reads <strong>46 out of 100, STRAIN</strong>, +0.1 against the last published reading, on 100% coverage. The pipes are working harder for the same result. This is the regime where surprises stop being cheap.</p>
<p>The heaviest hand on the dial is <strong>the calendar squeeze (weather)</strong> at a score of 100, worth +11.0 points of the total. Pinned at the ceiling today: the calendar squeeze (weather), the cash buffers, RRP and TGA (buffers). Those components are carrying no new information from day to day, and the letter names every one of them rather than only the loudest. When one component carries the reading, watch that component, not the headline.</p>
<p>Change gets attributed here, not just level: against the last letter, auction digestion (auctions) -0.1, the tail law (tails) +0.1, +0.0 points net across the components.</p>
<h2>2 · What moved</h2>
<p>The tape moved on its latest prints, none of them from last night: <strong>S&amp;P 500 index</strong> printed 7,736.52 pts (level z +2.6, change z +2.7, as of 2026-08-04); <strong>Nasdaq Composite index</strong> printed 26,584.99 pts (level z +2.6, change z +2.5, as of 2026-08-04); <strong>3-month T-bill secondary market rate</strong> printed 3.75 % (level z +1.4, change z +4.0, as of 2026-08-03).</p>
<p>Still flagged from prints already covered in an earlier letter: <strong>Central bank liquidity swaps outstanding (H.4.1)</strong> (|z| 15.7, as of 2026-07-29) [de minimis]; <strong>Discount window primary credit (Wed level)</strong> (|z| 3.4, as of 2026-07-29). A standing flag is context, not news; when a fresh print lands it goes back in the movers line. The flags marked de minimis (Central bank liquidity swaps outstanding (H.4.1)) sit at large sigma on series whose levels are a rounding error against their own history: the standardizer is reacting to a near-zero baseline, not to a large flow, and the letter would rather say that every day than let a big number do work the dollars do not support.</p>
<p>Repo held under the SRF ceiling for all of the last 20 sessions with SRF take-up at $0.0B, stigma score 0 of 100, the backstop is capping quietly.</p>
<h2>3 · The Tell</h2>
<p>The Tell, the gap between what the pipes measure and what the screens price, reads <strong>+39.0</strong>: plumbing indicators at the 69.0 percentile of their own history, market indicators at the 30.0, a gap of +39.0.</p>
<p>That is a wide disagreement, and it resolves one of two ways: the screens catch up to the pipes, or the pipes calm down to meet the screens. The reading is <em>plumbing leads price</em>.</p>
<h2>4 · Reserve scarcity</h2>
<p>The desk fits the reserve demand curve continuously, a public-data approximation of the NY Fed&#x27;s monthly Reserve Demand Elasticity (the Afonso, Giannone, La Spada and Williams lineage). Theirs is estimated on confidential bank-level fed funds transactions; this one is a hinge fit on SOFR minus IORB against reserves over GDP, which is a different and coarser instrument reaching for the same quantity, and the comparison below is the check on whether it gets there. Today&#x27;s fit puts the kink near <strong>$3,704B</strong> of reserves; the system holds $2,985B, $719B below the estimate.</p>
<p>Fit honesty: R² 0.62 against a flat curve; the observed SOFR minus IORB spread of -3.7bp versus the fit&#x27;s -0.8bp gives a consistency of 0.76. A modest fit is a lens, not a verdict, and the number is printed so you can discount it yourself.</p>
<p>Reserves are through the estimated kink, which is exactly where the spread should start answering to reserve changes. From here the board watches the slope, not the distance. Against that, the tape disagrees: SOFR is printing 3.7bp BELOW IORB, which is the abundance signature, not the scarce one. The honest reading is that the fitted kink is an estimate with a wide band and the observed spread is a fact, so scarcity here is a hypothesis the tape has not yet confirmed.</p>
<p>Reserves fell $77.6B on the week to $2,985B, and the ledger says where from: the TGA rebuilt $81.2B, the foreign RRP pool released $17.9B, the balance sheet shrank $9.2B, six legs summing to the reserve change to the dollar with $34.8B of the balance sheet, 0.52% of assets, still sitting in the unnamed residual.</p>
<p>External check: the NY Fed&#x27;s latest official RDE print (2026-07-06) reads -0.27bp per one percent of reserves; the desk&#x27;s continuous fit implies -0.30bp, inside their 68% band, direction agrees. The desk&#x27;s fit runs 23 days ahead of their release cycle, which is the whole point of fitting it continuously. Where the two diverge, one of us is wrong, and the scorecard keeps count.</p>
<p>The running record, not just today: across 18 of their releases the desk&#x27;s walk-forward fit landed inside their 68% band 8 times and agreed on direction 10 times, mean absolute gap 0.26bp. That is short of the two-in-three a calibrated nowcast should manage, so the fit is directionally useful and not yet precise. One matching print is an anecdote; this line is the claim, and it is graded against their current-vintage history rather than the print that stood on each cutoff date, which flatters neither side in a way the desk can measure.</p>
<h2>5 · The official sector</h2>
<p>Foreign officials cut their Fed custody Treasuries by $78.4B over 13 weeks while foreign RRP parking rose by $12.5B, only a partial rotation because the combined official footprint still fell $65.9B to $2,991B, 84% of the custody drop leaving the official sector rather than moving inside it.</p>
<h2>6 · The dates that matter</h2>
<p>The next date that matters is <strong>2026-08-11</strong>: $282B auction settlement while reserves sit below the estimated kink, worst case reserves near $2,966B after the drain. The turn model puts 2026-08-31 (month_end) at +3.2bp with a band of [-0.7, +7.8], severity 2/5. FOMC decides 2026-09-16, 42 days out. The corporate tax date lands 2026-09-15, 41 days out; tax dates drain reserves on a schedule everyone can read.</p>
<h2>7 · What the board is honest about</h2>
<p>Faults on the board today: gdelt. The affected inputs are degraded or dead and the composite&#x27;s coverage says so. A dashboard that hides its broken gauges is lying with a straight face. The record is in PROOF: event recall 62% (95% interval 36% to 82%, which is wide because the sample is 23 alert runs, not thousands) against a base rate of 4%, run precision 17%, and the median lead of 60 trading days is censored: 7 of 8 episodes were still flagged at the edge of the evaluation window, so the true lead is at least that and the number is a floor rather than a central estimate. The misses sit next to the hits; read those before weighting today&#x27;s letter.</p><h2>The Week Ahead: the calls on the record</h2><p class="lede">The Week Ahead 1: 5 pre-registered calls for the week of 2026-08-03, 2026-08-03. Each call carries a stable ID, the number the desk expects, the date it resolves and the rule that decides it, printed before the week runs. The next issue opens by grading them, misses first. <a href="/dispatches/2026-08-03-week-ahead.html">The full issue</a>.</p><p>Registered 5 calls for the week of 2026-08-03. Each carries a stable ID, the number the desk expects, the date it resolves and the rule that decides it. Next Monday&#x27;s issue opens by grading them, misses first.</p>
