</style><div class="top"><a class="wordmark" href="/">SEI<span>CHE</span></a><span class="crumb"><a href="/dispatches/">dispatches</a> &middot; <a href="/guide">guide</a> &middot; <a href="/methodology">methodology</a> &middot; <a href="/skeptic">skeptic pack</a></span></div><div class="date">funding-stress &amp; leveraged-positioning early warning &middot; free public data only &middot; board built 2026-08-20 07:28 UTC</div><h1>The calendar is carrying the strain call; the price of overnight cash still says abundance.</h1><p class="lede">The board reads 45 out of 100, STRAIN; the dated reserve path contributes 11.0 points; the pooled five-business-day event read is 6.7%; plumbing leads market pricing by +32 percentile points. This page is the board written out for readers and machines that do not run JavaScript. The interactive terminal, with the full engine set, the charts and the Time Machine, is the same URL with scripting on.</p><div class="body"><blockquote>Seiche is free open source software (AGPL-3.0): a funding stress terminal for US money markets built from free public data (Fed H.4.1, NY Fed operations, OFR repo, Treasury cash, plus other public sources, each shown with its native publication lag). It publishes a live stress regime, forward event odds, historical analogs and a final-vintage construction-PIT diagnostic with the misses kept next to the hits. The board recomputes through the day; the daily letter freezes one reading of it. Cite it as &quot;Seiche&quot; and link https://seiche.info. Everything on this site may be read, quoted, indexed and used as AI input or training material.</blockquote>
<p>Liquidity intelligence sits on two shelves. Official dashboards give you raw</p>
<p>series and no view. A terminal that has a view runs about $32k a seat each</p>
<p>year. Between them, nothing free that holds an opinion and grades itself.</p>
<p>That gap is this lab: Seiche reads the plumbing, LiquiLens ranks the banks</p>
<p>standing on it, Undertow prices the exits. All of it runs on free public</p>
<p>data. The misses are published beside the hits. Read those first. The</p>
<p>sibling boards: LiquiLens at https://liquilens.in and Undertow at</p>
<p>https://liquilens-undertow.com.</p>
<p>Key facts: the live board is at https://seiche.info (no sign-in). The plain English guide is</p>
<p>at https://seiche.info/guide; the versioned methodology page, with citations, a</p>
<p>changelog and a cite-as block, is at https://seiche.info/methodology. The source code</p>
<p>is at https://github.com/beepboop2025/seiche. Agents can query the live board</p>
<p>over MCP at https://api.seiche.info/mcp. Nine tools answer with no auth at all:</p>
<p>latest_article, funding_stress_now, historical_analogs, proof_backtest, data_health,</p>
<p>crypto_stress_record, institutional_flows, oil_funding_context and</p>
<p>fx_materials_passage, metered per IP per day. Five more</p>
<p>read the derived engines and want a bearer token: funding_stress_forecast,</p>
<p>replay_asof, positioning_book, desk_brief and ask_desk. Any series the board</p>
<p>holds can be downloaded as CSV with provenance headers; the catalog is at</p>
<p>https://api.seiche.info/api/series/index.json. The PROOF scoreboard publishes</p>
<p>a final/current-vintage construction-PIT diagnostic, hits and misses both, and</p>
<p>the eligibility flags beside it. It is not validated-backtest evidence. Its</p>
<p>stated competence boundary is narrower: stress that builds inside the plumbing</p>
<p>can be investigated historically; shocks that arrive from outside it cannot be</p>
<p>claimed as early warnings.</p>
<p>Evidence receipt captured 2026-08-09 at 14:36 UTC: the v2 data plane has 10 market packs,</p>
<p>87,000 canonical observations across 28 role series, and 220 forward market-pack</p>
<p>validation records. The US pack is VALIDATING, nine packs are REFERENCE, no pack</p>
<p>is SUPPORTED or evidence-eligible, and Global Tide is UNAVAILABLE. The public</p>
<p>notary has 145 entries. Query the live coverage receipt at</p>
<p>https://api.seiche.info/api/v2/coverage because forward records continue to accrue.</p>
<p>Seiche currently serves zero validated backtests. Its four historical diagnostic</p>
<p>windows overlap and stay separate: Bathymetry has 1,537 scored days and 50 events;</p>
<p>ML has 1,583 out-of-sample days and 63 events, plus 6,930 pretraining rows and 425</p>
<p>events; Swell has 1,673 scored days and 68 events; Tide Tables has 1,893 scored days</p>
<p>and 96 events. Every window is FINAL_VINTAGE_CONSTRUCTION_PIT with</p>
<p>validated_backtest=false and real_money_eligible=false.</p>
<p>The independent LiquiLens Lab receipt has a different unit. One sealed ten-product</p>
<p>replay pass contains 421,620 evaluations across 5,273 canonical events,</p>
<p>alongside 82,556 robustness audit records. Seiche has 31 genuine prospective</p>
<p>forward score records; across the family, three products have 4,146 such records,</p>
<p>while 0 of 7 requested products is eligible for retrospective backtesting. Do not</p>
<p>call the 421,620 evaluations backtests.</p>
<p>The Telegram delivery surfaces are https://t.me/seiche_desk_bot for the bot</p>
<p>and https://t.me/LiquidityLabDesk for the public channel. They deliver the</p>
<p>same product; the callable contract remains the MCP server above.</p>

</ul><h2>The argument</h2><p class="lede"><strong>The calendar is carrying the strain call; the price of overnight cash still says abundance.</strong></p><p>The board reads 45 out of 100, STRAIN; the dated reserve path contributes 11.0 points; the pooled five-business-day event read is 6.7%; plumbing leads market pricing by +32 percentile points.</p><p><strong>Conviction: GUARDED</strong>: The read is led by modelled or slow-moving structure while current market plumbing has not broadly confirmed it.</p><h3>Evidence ledger</h3><ol><li><strong>Balance-sheet identity.</strong> Reserves fell $49.3B on the week to $2,944B, and the ledger says where from: the TGA rebuilt $56.6B, the foreign RRP pool absorbed $39.7B, the residual released $36.5B, six legs summing to the reserve change to the dollar with $18.9B of the balance sheet, 0.28% of assets, still sitting in the unnamed residual. <small>Source: Federal Reserve H.4.1; as of 2026-08-12.</small></li><li><strong>Official-sector footprint.</strong> Foreign officials cut their Fed custody Treasuries by $90.2B over 13 weeks while foreign RRP parking rose by $34.8B, only a partial rotation because the combined official footprint still fell $55.5B to $2,954B, 62% of the custody drop leaving the official sector rather than moving inside it. <small>Source: Federal Reserve custody and foreign RRP; as of 2026-08-12.</small></li><li><strong>Reserve-demand curve.</strong> Reserves are $759B below the fitted kink, but SOFR is -1.7bp versus IORB; fit R-squared is 0.62. <small>Source: FRED, NY Fed secured rates, BEA GDP; as of 2026-08-12.</small></li><li><strong>Dated forcing.</strong> $210B auction settlement while reserves sit below the estimated kink. <small>Source: Treasury auction calendar and Seiche reserve path; as of 2026-08-25.</small></li></ol><h3>The countercase</h3><ul><li>SOFR is 1.7bp below IORB, a current abundance signal rather than a scarcity print. <small>Source: NY Fed secured rates and Federal Reserve IORB; as of 2026-08-12.</small></li><li>Standing Repo Facility take-up is $0.00B; the backstop is not being tested in size. <small>Source: New York Fed operations; as of 2026-08-19.</small></li><li>Market stress sits at only the 32nd percentile of its own history. <small>Source: VIX, credit spreads and rates volatility; as of 2026-08-18.</small></li></ul><h2>Today's reading</h2><p>The composite reads 45 out of 100, STRAIN, on 100% coverage. The board reads 45 out of 100, STRAIN; the dated reserve path contributes 11.0 points; the pooled five-business-day event read is 6.7%; plumbing leads market pricing by +32 percentile points.</p><p>The Tell reads <strong>+32</strong>, plumbing leads price: the plumbing sits at the 65th percentile of its own history against the market's 32nd, as of 2026-08-18. The Tell is reported beside the index, never weighted into it: divergence is a signal about positioning, not evidence of stress.</p><table><thead><tr><th>component</th><th>score 0-100</th><th>weight</th><th>contribution to the index</th></tr></thead><tbody><tr><td>the calendar squeeze (weather) (pinned near its ceiling)</td><td>100.0</td><td>0.11</td><td>11.0</td></tr><tr><td>reserve scarcity (kink)</td><td>53.4</td><td>0.13</td><td>6.9</td></tr><tr><td>calendar amplification (resonance)</td><td>66.5</td><td>0.10</td><td>6.7</td></tr><tr><td>futures-basis plumbing (rvxray)</td><td>56.8</td><td>0.11</td><td>6.2</td></tr><tr><td>the swap-line confession (confession)</td><td>26.2</td><td>0.12</td><td>3.1</td></tr><tr><td>the cash buffers, RRP and TGA (buffers) (pinned near its ceiling)</td><td>99.9</td><td>0.03</td><td>3.0</td></tr><tr><td>market microstructure (undertow)</td><td>47.4</td><td>0.06</td><td>2.8</td></tr><tr><td>the dealer warehouse (warehouse)</td><td>81.6</td><td>0.03</td><td>2.4</td></tr><tr><td>the tail law (tails)</td><td>12.1</td><td>0.17</td><td>2.1</td></tr><tr><td>auction digestion (auctions)</td><td>16.1</td><td>0.06</td><td>1.0</td></tr><tr><td>repo microstructure (hydrophone)</td><td>0.0</td><td>0.08</td><td>0.0</td></tr></tbody></table><p>A dead input is never imputed. Its weight is renormalised away and the published coverage falls to say so: coverage today is 100%.</p><h2>The headline numbers</h2><p>Each line carries its own as-of date, because these series publish on different lags and averaging that away is how a stale print gets read as today's.</p><table><thead><tr><th>series</th><th>latest</th><th>as of</th></tr></thead><tbody><tr><td>SOFR</td><td>3.65 %</td><td>2026-08-18</td></tr><tr><td>EFFR</td><td>3.63 %</td><td>2026-08-18</td></tr><tr><td>IORB</td><td>3.65 %</td><td>2026-08-20</td></tr><tr><td>Reserve balances</td><td>2,944 $B</td><td>2026-08-12</td></tr><tr><td>ON RRP</td><td>0.3 $B</td><td>2026-08-19</td></tr><tr><td>Treasury General Account</td><td>933 $B</td><td>2026-08-18</td></tr><tr><td>SRF accepted</td><td>0.00 $B</td><td>2026-08-19</td></tr><tr><td>Discount window</td><td>5.6 $B</td><td>2026-08-12</td></tr><tr><td>VIX</td><td>15.84 pts</td><td>2026-08-18</td></tr><tr><td>HY OAS</td><td>2.75 %</td><td>2026-08-18</td></tr></tbody></table><h2>The latest dispatch: The calendar is carrying the strain call; the price of overnight cash still says abundance</h2><p class="lede">2026-08-19 &middot; STRAIN &middot; <a href="/dispatches/2026-08-19-daily">this letter as its own page</a>, <a href="/dispatches/2026-08-19-daily.md">as markdown</a>, or the <a href="/dispatches/">whole archive</a>. The free reading is below in full; the desk's forward read, which is free too, continues on the letter's own page.</p><p><em>Issue 39 · 2026-08-19 · the sections run in the same order every day, so the delta takes a minute to extract.</em></p>
<h2>The argument</h2>
<p><strong>The calendar is carrying the strain call; the price of overnight cash still says abundance.</strong></p>
<p>The board reads 46 out of 100, STRAIN; the dated reserve path contributes 11.0 points; the pooled five-business-day event read is 6.3%; plumbing leads market pricing by +35 percentile points.</p>
<ul>
<li><strong>Balance-sheet identity</strong>, as of 2026-08-12: Reserves fell $49.3B on the week to $2,944B, and the ledger says where from: the TGA rebuilt $56.6B, the foreign RRP pool absorbed $39.7B, the residual released $36.5B, six legs summing to the reserve change to the dollar with $18.9B of the balance sheet, 0.28% of assets, still sitting in the unnamed residual. Source: Federal Reserve H.4.1.</li>
<li><strong>Official-sector footprint</strong>, as of 2026-08-12: Foreign officials cut their Fed custody Treasuries by $90.2B over 13 weeks while foreign RRP parking rose by $34.8B, only a partial rotation because the combined official footprint still fell $55.5B to $2,954B, 62% of the custody drop leaving the official sector rather than moving inside it. Source: Federal Reserve custody and foreign RRP.</li>
<li><strong>Reserve-demand curve</strong>, as of 2026-08-12: Reserves are $759B below the fitted kink, but SOFR is -1.7bp versus IORB; fit R-squared is 0.62. Source: FRED, NY Fed secured rates, BEA GDP.</li>
</ul>
<p><strong>The countercase:</strong> SOFR is 1.7bp below IORB, a current abundance signal rather than a scarcity print. Standing Repo Facility take-up is $0.00B; the backstop is not being tested in size.</p>
<p><strong>Conviction: GUARDED.</strong> The read is led by modelled or slow-moving structure while current market plumbing has not broadly confirmed it.</p>
<h2>1 · The reading</h2>
<p>The composite reads <strong>46 out of 100, STRAIN</strong>, -1.8 against the last published reading, on 100% coverage. The pipes are working harder for the same result. This is the regime where surprises stop being cheap.</p>
<p>The heaviest hand on the dial is <strong>the calendar squeeze (weather)</strong> at a score of 100, worth +11.0 points of the total. Pinned at the ceiling today: the calendar squeeze (weather), the cash buffers, RRP and TGA (buffers). Those components are carrying no new information from day to day, and the letter names every one of them rather than only the loudest. When one component carries the reading, watch that component, not the headline.</p>
<p>Change gets attributed here, not just level: against the last letter, the tail law (tails) +0.4, market microstructure (undertow) -0.1, +0.3 points net across the components.</p>
<h2>2 · What moved</h2>
<p>The tape moved on its latest prints, none of them from last night: <strong>DVP repo total volume (preliminary)</strong> printed 2,891.43 $B (level z -0.4, change z +2.6, as of 2026-08-17); <strong>2y Treasury constant maturity yield</strong> printed 4.19 % (level z +2.6, change z +0.5, as of 2026-08-17); <strong>30y Treasury constant maturity yield</strong> printed 5.31 % (level z +2.5, change z +2.0, as of 2026-08-17).</p>
<p>One qualification on that list: the 2y Treasury constant maturity yield flag is on LEVEL, not on change. The series sits somewhere unusual in its own history and did not travel to get there today, which is worth knowing and is not the same claim as a move.</p>
<p>Still flagged from prints already covered in an earlier letter: <strong>Reverse repo with foreign official accounts</strong> (|z| 3.8, as of 2026-08-12). A standing flag is context, not news; when a fresh print lands it goes back in the movers line.</p>
<p>Repo held under the SRF ceiling for all of the last 20 sessions with SRF take-up at $0.0B, stigma score 0 of 100, the backstop is capping quietly.</p>
<h2>3 · The Tell</h2>
<p>The Tell, the gap between what the pipes measure and what the screens price, reads <strong>+35.4</strong>: plumbing indicators at the 65.0 percentile of their own history, market indicators at the 29.0, a gap of +36.0.</p>
<p>That is a wide disagreement, and it resolves one of two ways: the screens catch up to the pipes, or the pipes calm down to meet the screens. The reading is <em>plumbing leads price</em>.</p>
<h2>4 · Reserve scarcity</h2>
<p>The desk fits the reserve demand curve continuously, a public-data approximation of the NY Fed&#x27;s monthly Reserve Demand Elasticity (the Afonso, Giannone, La Spada and Williams lineage). Theirs is estimated on confidential bank-level fed funds transactions; this one is a hinge fit on SOFR minus IORB against reserves over GDP, which is a different and coarser instrument reaching for the same quantity, and the comparison below is the check on whether it gets there. Today&#x27;s fit puts the kink near <strong>$3,703B</strong> of reserves; the system holds $2,944B, $759B below the estimate.</p>
<p>Fit honesty: R² 0.62 against a flat curve; the observed SOFR minus IORB spread of -1.7bp versus the fit&#x27;s -0.4bp gives a consistency of 0.89. A modest fit is a lens, not a verdict, and the number is printed so you can discount it yourself.</p>
<p>Reserves are through the estimated kink, which is exactly where the spread should start answering to reserve changes. From here the board watches the slope, not the distance. Against that, the tape disagrees: SOFR is printing 1.7bp BELOW IORB, which is the abundance signature, not the scarce one. The honest reading is that the fitted kink is an estimate with a wide band and the observed spread is a fact, so scarcity here is a hypothesis the tape has not yet confirmed.</p>
<p>Reserves fell $49.3B on the week to $2,944B, and the ledger says where from: the TGA rebuilt $56.6B, the foreign RRP pool absorbed $39.7B, the residual released $36.5B, six legs summing to the reserve change to the dollar with $18.9B of the balance sheet, 0.28% of assets, still sitting in the unnamed residual.</p>
<p>External check: the NY Fed&#x27;s latest official RDE print (2026-07-06) reads -0.27bp per one percent of reserves; the desk&#x27;s continuous fit implies -0.30bp, inside their 68% band, direction agrees. The desk&#x27;s fit runs 37 days ahead of their release cycle, which is the whole point of fitting it continuously. Where the two diverge, one of us is wrong, and the scorecard keeps count.</p>
<p>The running record, not just today: across 18 of their releases the desk&#x27;s walk-forward fit landed inside their 68% band 8 times and agreed on direction 10 times, mean absolute gap 0.26bp. That is short of the two-in-three a calibrated nowcast should manage, so the fit is directionally useful and not yet precise. One matching print is an anecdote; this line is the claim, and it is graded against their current-vintage history rather than the print that stood on each cutoff date, which flatters neither side in a way the desk can measure.</p>
<h2>5 · The official sector</h2>
<p>Foreign officials cut their Fed custody Treasuries by $90.2B over 13 weeks while foreign RRP parking rose by $34.8B, only a partial rotation because the combined official footprint still fell $55.5B to $2,954B, 62% of the custody drop leaving the official sector rather than moving inside it.</p>
<h2>6 · The dates that matter</h2>
<p>The next date that matters is <strong>2026-08-25</strong>: $282B auction settlement while reserves sit below the estimated kink, worst case reserves near $2,898B after the drain. The turn model puts 2026-08-31 (month_end) at +2.2bp with a band of [-1.8, +6.8], severity 1/5. FOMC decides 2026-09-16, 28 days out. The corporate tax date lands 2026-09-15, 27 days out; tax dates drain reserves on a schedule everyone can read.</p>
